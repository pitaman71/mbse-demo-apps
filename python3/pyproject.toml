[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-demo-apps"
version = "0.1.0"
description = "Demo applications for the mbse repositories: schema-driven apps end to end"
requires-python = ">=3.11"
dependencies = ["mbse-schemas>=0.25.0,<0.26"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkouts: ../mbse-basis/scripts/polyrepo.py

[tool.pytest.ini_options]
testpaths = ["tests"]
